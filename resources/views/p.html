<script>
$(function () {
  const yearSelect = $('#cal_year');
  const programmeSelect = $('#programme_id');
  const loading = $('#loading-indicator');
  const tableElem = $('#participants-table');
  let selectedParticipants = [];

  const table = tableElem.DataTable({
    ajax: {
      url: '{{ route("admin.nominations.byProgramme") }}',
      dataSrc: 'data',
      data: d => {
        d.programme_id = programmeSelect.val();
      }
    },
    columns: [
      { data: null, render: data => `<input type="checkbox" class="participant-checkbox" data-id="${data.id}">` },
      { data: 'name' },
      {data:'designation'},
      { 
        data: 'nomination.agency_type.name',
        render: function (data) {
          return data || 'No Agency Type';  // Fallback if agencyType name is not found
        }
      },
      {data:'city'},
      { 
        data: null, 
        render: function (data) {
          return `${data.email} | ${data.phone}`;  // Combine email and phone in a single column
        }
      },
      {data: 'status', render: function (data) {
        return data || 'No Status'; // Display 'No Status' if no status is found
      }},
      {data: 'hostel_attendence', render: function (data) {
        return data || 'No Attendence'; // Display 'No Status' if no status is found
      }},

      {
  data: null,
  render: function (data, type, row) {
    return `${data.checkout_time || 'N/A'}, ${data.date || 'N/A'}`;
  }
}


    ],
    language: { emptyTable: 'Select year & programme to load participants' }
  });

  yearSelect.on('change', () => {
    const year = yearSelect.val();
    programmeSelect.find('option[data-year]').each(function () {
      $(this).toggle($(this).data('year') == year);
    });
    programmeSelect.val('');
    table.clear().draw();
  });

  programmeSelect.on('change', () => {
    if (programmeSelect.val()) {
      loading.show();
      table.ajax.reload(() => loading.hide());
    } else {
      table.clear().draw();
    }
  });

  $('#select-all').on('change', function () {
    $('.participant-checkbox').prop('checked', this.checked);
    updateSelectedParticipants();
  });

  tableElem.on('change', '.participant-checkbox', function () {
    updateSelectedParticipants();
    $('#select-all').prop('checked', $('.participant-checkbox').length === $('.participant-checkbox:checked').length);
  });

  function updateSelectedParticipants() {
    selectedParticipants = $('.participant-checkbox:checked').map(function () {
      return $(this).data('id');
    }).get();
  }

  function performAction(url, data, message) {
    if (!selectedParticipants.length) return alert('Please select at least one participant.');
    loading.show();
    $.post(url, { ...data, participant_ids: selectedParticipants, _token: '{{ csrf_token() }}' })
      .done(() => {
        alert(message);
        table.ajax.reload();
      })
      .fail(xhr => alert('Error: ' + xhr.responseText))
      .always(() => loading.hide());
  }

  // Handling status update
 


 
});

</script>

<script>
  $(function () {
    const tableElem = $('#participants-table');
    let selectedParticipants = [];
  
    // Update selected participants when checkboxes change
    tableElem.on('change', '.participant-checkbox', function () {
      selectedParticipants = $('.participant-checkbox:checked').map(function () {
        return $(this).data('id');
      }).get();
    });
  
    // Handle Confirm button click
    $('#btn-mark').on('click', function () {
      if (selectedParticipants.length === 0) {
        return alert('Please select at least one participant.');
      }
      performAction('Present', ' Attendence updated to Mark.');
    });
  
    // Handle Regret button click
    $('#btn-clear').on('click', function () {
      if (selectedParticipants.length === 0) {
        return alert('Please select at least one participant.');
      }
      performAction('Absent', 'Attendence updated to Clear.');
    });
  
    // Handle Cancel button click
    $('#btn-email').on('click', function () {
      if (selectedParticipants.length === 0) {
        return alert('Please select at least one participant.');
      }
      performAction('mark by email', 'Attendence updated to mark by email.');
    });
  
    // Handle Pending button click
    $('#btn-email-r').on('click', function () {
      if (selectedParticipants.length === 0) {
        return alert('Please select at least one participant.');
      }
      performAction('regret by email', 'Attendence set to regret by email.');
    });
  
    // Perform the action and send data to the server
    function performAction(status, message) {
      $.ajax({
        url: '{{ route("admin.hostel.updateAttendence") }}',
        type: 'POST',
        data: {
          _token: '{{ csrf_token() }}',  
          participant_ids: selectedParticipants,
          status: status
        },
        success: function () {
          alert(message);
          tableElem.DataTable().ajax.reload();
        },
        error: function (xhr) {
          alert('Error: ' + xhr.responseText);
        }
      });
    }
  });
  
  
  
  
  </script>

  <script>

$(function () {
  const tableElem = $('#participants-table');
  let selectedParticipants = [];

  // Show datetime picker if any checkbox is selected
  tableElem.on('change', '.participant-checkbox', function () {
    selectedParticipants = $('.participant-checkbox:checked').map(function () {
      return $(this).data('id');
    }).get();

    $('#datetime-picker').toggle(selectedParticipants.length > 0);
  });

  // Handle Date & Time update
  $('#btn-update-datetime').on('click', function () {
    const date = $('#attend_date').val();
    const time = $('#attend_time').val();

    if (!selectedParticipants.length) {
      return alert('Please select at least one participant.');
    }
    if (!date || !time) {
      return alert('Please select both date and time.');
    }

    $.ajax({
      url: '{{ route("admin.participants.updateDatetime") }}',
      method: 'POST',
      data: {
        _token: '{{ csrf_token() }}',
        participant_ids: selectedParticipants,
        date: date,
        time: time     
      },
      success: function () {
        alert('Date and Time updated for selected participants.');
        $('#participants-table').DataTable().ajax.reload();
        $('#datetime-picker').hide();
        $('#attend_date').val('');
        $('#attend_time').val('');
      },
      error: function (xhr) {
        alert('Error: ' + xhr.responseText);
      }
    });
  });
});

  </script>
